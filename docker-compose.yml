version: '3.9'

services:
  backend:
    build: ./backend
    container_name: express-server
    environment:
      - PORT=3400
    ports:
      - "3500:3400"
    restart: always
  frontend:
    build: ./frontend
    container_name: react-client2
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    
